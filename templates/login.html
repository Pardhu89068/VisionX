<!DOCTYPE html>
<html>

<head>

    <title>VisionX - Enter the Intelligence Core</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #edf7ff;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(40, 130, 230, 0.16),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 15% 80%,
                    rgba(70, 80, 200, 0.12),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    rgba(40, 170, 220, 0.10),
                    transparent 28%
                ),

                #030711;
        }


        /* --------------------------------
           DIGITAL UNIVERSE
        -------------------------------- */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.8) 1px,
                    transparent 1px
                );

            background-size: 85px 85px;

            opacity: 0.13;

            pointer-events: none;
        }


        body::after {

            content: "";

            position: fixed;

            width: 720px;

            height: 720px;

            border-radius: 50%;

            border:
                1px solid rgba(90,180,255,0.08);

            box-shadow:

                0 0 80px
                rgba(40,140,255,0.08),

                inset 0 0 100px
                rgba(40,140,255,0.05);

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;
        }


        /* --------------------------------
           LOGIN CARD
        -------------------------------- */

        .container {

            position: relative;

            z-index: 5;

            width: min(430px, 91vw);

            padding: 38px;

            border-radius: 22px;

            border:
                1px solid
                rgba(130,190,240,0.18);

            background:

                linear-gradient(
                    145deg,
                    rgba(14,27,47,0.91),
                    rgba(5,11,23,0.95)
                );

            backdrop-filter: blur(22px);

            box-shadow:

                0 30px 100px
                rgba(0,0,0,0.55),

                0 0 60px
                rgba(40,150,255,0.07);
        }


        /* --------------------------------
           BRAND
        -------------------------------- */

        .brand-core {

            width: 66px;

            height: 66px;

            margin: 0 auto 17px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 17px;

            font-weight: bold;

            letter-spacing: 1px;

            color: white;

            border:
                1px solid
                rgba(120,200,255,0.55);

            background:

                radial-gradient(
                    circle,
                    rgba(80,180,255,0.42),
                    rgba(20,45,90,0.18)
                );

            box-shadow:

                0 0 25px
                rgba(60,180,255,0.24),

                inset 0 0 20px
                rgba(100,200,255,0.12);
        }


        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: 6px;

            color: #f4fbff;
        }


        .tagline {

            text-align: center;

            margin-top: 9px;

            margin-bottom: 31px;

            color: #6f89a5;

            font-size: 10px;

            letter-spacing: 2.5px;

            text-transform: uppercase;
        }


        .access-label {

            text-align: center;

            color: #6fb8e8;

            font-size: 10px;

            letter-spacing: 3px;

            margin-bottom: 9px;
        }


        h2 {

            text-align: center;

            margin:

                0 0 26px;

            font-size: 25px;

            color: #f1f8ff;
        }


        /* --------------------------------
           ERROR
        -------------------------------- */

        .error {

            background:
                rgba(220,60,70,0.09);

            color: #ff9ca5;

            border:
                1px solid
                rgba(255,90,100,0.18);

            padding: 11px 13px;

            border-radius: 9px;

            margin-bottom: 17px;

            font-size: 13px;
        }


        /* --------------------------------
           INPUTS
        -------------------------------- */

        label {

            display: block;

            font-size: 11px;

            color: #91a9c1;

            letter-spacing: 0.8px;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 18px;

            border-radius: 9px;

            border:
                1px solid
                rgba(130,180,220,0.16);

            background:
                rgba(255,255,255,0.035);

            color: #f2f8ff;

            font-size: 14px;

            outline: none;

            transition: 0.25s;
        }


        input::placeholder {

            color: #526a83;
        }


        input:focus {

            border-color:
                rgba(90,190,255,0.55);

            background:
                rgba(70,150,220,0.06);

            box-shadow:
                0 0 0 3px
                rgba(70,170,255,0.07);
        }


        /* --------------------------------
           LOGIN BUTTON
        -------------------------------- */

        .login-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:

                linear-gradient(
                    135deg,
                    #8bd8ff,
                    #48aef5
                );

            color: #03101c;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 25px
                rgba(70,180,255,0.16);

            transition: 0.25s;
        }


        .login-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 35px
                rgba(70,180,255,0.30);
        }


        /* --------------------------------
           DIVIDER
        -------------------------------- */

        .divider {

            display: flex;

            align-items: center;

            margin: 25px 0;

            color: #4e647c;

            font-size: 9px;

            letter-spacing: 1.5px;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(120,170,220,0.12);
        }


        .divider span {

            padding: 0 12px;
        }


        /* --------------------------------
           SOCIAL BUTTONS
        -------------------------------- */

        .social-btn {

            width: 100%;

            height: 47px;

            margin-bottom: 11px;

            border:
                1px solid
                rgba(130,180,220,0.15);

            border-radius: 9px;

            background:
                rgba(255,255,255,0.035);

            color: #dcebf8;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            gap: 11px;

            transition: 0.25s;
        }


        .social-btn:hover {

            background:
                rgba(90,170,230,0.07);

            border-color:
                rgba(110,190,250,0.3);

            transform:
                translateY(-1px);
        }


        /* --------------------------------
           GOOGLE
        -------------------------------- */

        .google-logo {

            width: 22px;

            height: 22px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 20px;

            font-weight: bold;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    45deg,
                    #4285F4,
                    #34A853,
                    #FBBC05,
                    #EA4335
                );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        /* --------------------------------
           MICROSOFT
        -------------------------------- */

        .microsoft-logo {

            width: 19px;

            height: 19px;

            display: grid;

            grid-template-columns:
                9px 9px;

            grid-template-rows:
                9px 9px;

            gap: 2px;
        }


        .microsoft-logo span:nth-child(1) {
            background: #f25022;
        }


        .microsoft-logo span:nth-child(2) {
            background: #7fba00;
        }


        .microsoft-logo span:nth-child(3) {
            background: #00a4ef;
        }


        .microsoft-logo span:nth-child(4) {
            background: #ffb900;
        }


        /* --------------------------------
           REGISTER
        -------------------------------- */

        .register {

            text-align: center;

            margin-top: 24px;

            font-size: 12px;

            color: #627990;
        }


        .register a {

            color: #83cfff;

            font-weight: bold;

            text-decoration: none;

            margin-left: 4px;
        }


        .register a:hover {

            text-decoration: underline;
        }


        /* --------------------------------
           FOOTER
        -------------------------------- */

        .secure {

            text-align: center;

            margin-top: 25px;

            color: #40566d;

            font-size: 9px;

            letter-spacing: 1.5px;
        }


        /* --------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 500px) {

            .container {

                padding: 30px 23px;
            }

            .logo {

                font-size: 27px;

                letter-spacing: 5px;
            }

            h2 {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="brand-core">
        VX
    </div>


    <div class="logo">
        VISIONX
    </div>


    <div class="tagline">
        Intelligent Document Analysis
    </div>


    <div class="access-label">
        INTELLIGENCE CORE
    </div>


    <h2>
        Welcome Back
    </h2>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <!-- NORMAL LOGIN -->

    <form
        method="POST"
        action="{{ url_for('login') }}"
    >


        <label>
            EMAIL ADDRESS
        </label>


        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            PASSWORD
        </label>


        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            class="login-btn"
        >

            Enter VisionX

        </button>


    </form>


    <div class="divider">

        <span>OR CONTINUE WITH</span>

    </div>


    <!-- GOOGLE LOGIN -->

    <a
        href="{{ url_for('google_login') }}"
        class="social-btn"
    >

        <span class="google-logo">
            G
        </span>

        Continue with Google

    </a>


    <!-- MICROSOFT LOGIN -->

    <button
        type="button"
        class="social-btn"
        onclick="alert('Microsoft login will be connected next.')"
    >

        <span class="microsoft-logo">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </span>

        Continue with Microsoft

    </button>


    <!-- REGISTER -->

    <div class="register">

        Don't have an account?

        <a
            href="{{ url_for('register') }}"
        >
            Create an account
        </a>

    </div>


    <div class="secure">
        SECURE • INTELLIGENT • VISIONX
    </div>


</div>


</body>

</html>
